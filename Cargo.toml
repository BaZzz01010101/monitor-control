[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/cli",
    "crates/lab",
    "crates/tray",
]

[workspace.package]
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
parking_lot = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.9"
windows = "0.62"
