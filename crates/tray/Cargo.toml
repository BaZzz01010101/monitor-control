[package]
name = "dell-controller-tray"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
dell-controller-core = { path = "../core" }
native-windows-gui = { version = "1.0", default-features = false, features = ["animation-timer", "cursor", "frame", "high-dpi", "image-decoder", "menu", "message-window", "rich-textbox", "trackbar", "tray-notification"] }
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[[bin]]
name = "dell-controller-tray"
path = "src/main.rs"
