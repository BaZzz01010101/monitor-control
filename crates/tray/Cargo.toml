[package]
name = "dell-controller-tray"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
dell-controller-core = { path = "../core" }
image = { version = "0.25", default-features = false, features = ["png"] }
raw-window-handle = "0.6"
slint = { version = "1.16.1", features = ["raw-window-handle-06"] }
tray-icon = "0.23.1"
windows = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "1.16.1"

[[bin]]
name = "dell-controller-tray"
path = "src/main.rs"
